services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: salesia
      POSTGRES_PASSWORD: salesia
      POSTGRES_DB: salesia
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salesia"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://salesia:salesia@db:5432/salesia
      SECRET_KEY: ${SECRET_KEY:-cambia-esta-clave-en-produccion}
      CORS_ORIGINS: http://localhost:8080
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SEED_ON_START: ${SEED_ON_START:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
